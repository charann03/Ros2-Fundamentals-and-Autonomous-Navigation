docking_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 50.0
    initial_perception_timeout: 20.0  # Default 5.0 
    wait_charge_timeout: 5.0
    dock_approach_timeout: 30.0
    undock_linear_tolerance: 0.30 #0.05
    undock_angular_tolerance: 0.0 #0.05
    max_retries: 3
    base_frame: "base_link"
    fixed_frame: "odom"
    dock_backwards: false #false
    dock_prestaging_tolerance: 0.5
    enable_stamped_cmd_vel: false
    rotation_angular_tolerance: 3.14
    odom_topic: /odometry/filtered

 
    # Types of docks
    dock_plugins: ['rosmaster_x3_dock']
    rosmaster_x3_dock:
      plugin: 'opennav_docking::SimpleChargingDock'
      docking_threshold: 0.1
      dock_direction: forward   #forward
      staging_x_offset: 3.0  #0.75
      staging_yaw_offset: 3.14 #3.14
      use_external_detection_pose: true
      use_battery_status: false
      use_stall_detection: false
      stall_velocity_threshold: 1.0
      stall_effort_threshold: 1.0
      charging_threshold: 0.5
      rotate_to_dock: false #false
      # enable_stamped_cmd_vel: false
      external_detection_timeout: 1.0
      external_detection_translation_x: -0.26 #-0.18  #distance from base_link to docking port
      external_detection_translation_y: 0.0
      external_detection_rotation_roll: -1.57
      external_detection_rotation_pitch: 1.57
      external_detection_rotation_yaw: 0.0
      filter_coef: 0.2 #0.1
 
    # Dock instances
    dock_database: $(find-pkg-share clean_bot_docking)/config/dock_database.yaml
 
    controller:
      k_phi: 3.0
      k_delta: 2.0
      beta: 0.4
      lambda: 2.0
      v_linear_min: 0.1
      v_linear_max: 0.15
      v_angular_max: 0.75
      slowdown_radius: 0.25
      use_collision_detection: false #true
      costmap_topic: "/local_costmap/costmap_raw"
      footprint_topic: "/local_costmap/published_footprint"
      transform_tolerance: 0.5   #0.1
      projection_time: 5.0
      simulation_step: 0.1
      dock_collision_threshold: 0.0  #0.3 

loopback_simulator:
  ros__parameters:
    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    map_frame_id: "map"
    scan_frame_id: "base_scan" # tb4_loopback_simulator.launch.py remaps to 'rplidar_link'
    update_duration: 0.02
    scan_range_min: 0.05
    scan_range_max: 30.0
    scan_angle_min: -3.1415
    scan_angle_max: 3.1415
    scan_angle_increment: 0.02617
    scan_use_inf: true


