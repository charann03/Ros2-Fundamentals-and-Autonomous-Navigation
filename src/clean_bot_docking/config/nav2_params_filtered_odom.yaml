route_server:
  ros__parameters:
    /bond_disable_heartbeat_timeout: true
    AdjustSpeedLimit:
      plugin: nav2_route::AdjustSpeedLimit
      speed_limit_topic: speed_limit
      speed_tag: speed_limit
    CollisionMonitor:
      check_resolution: 1
      costmap_topic: local_costmap/costmap_raw
      max_collision_dist: 0.5
      max_cost: 1.0 #253.0
      plugin: nav2_route::CollisionMonitor
      rate: 1.0
      reroute_on_collision: true
    CostmapScorer:
      check_resolution: 2
      costmap_topic: global_costmap/costmap_raw
      invalid_off_map: true
      invalid_on_collision: true
      max_cost: 1.0   #253.0
      plugin: nav2_route::CostmapScorer
      use_maximum: true
      weight: 1.0
    DistanceScorer:
      plugin: nav2_route::DistanceScorer
      speed_tag: speed_limit
      weight: 1.0
    GeoJsonGraphFileLoader:
      plugin: nav2_route::GeoJsonGraphFileLoader
    ReroutingService:
      plugin: nav2_route::ReroutingService
    aggregate_blocked_ids: false
    autostart_node: false
    base_frame: base_link
    bond_heartbeat_period: 0.1
    boundary_radius_to_achieve_node: 0.0
    costmap_topic: global_costmap/costmap_raw
    edge_cost_functions:
    - DistanceScorer
    - CostmapScorer
    enable_nn_search: true
    graph_file_loader: GeoJsonGraphFileLoader
    graph_filepath: /home/charann-inc5751/test.geojson
    max_iterations: 0
    max_nn_search_iterations: 10000
    max_planning_time: 2.0
    max_prune_dist_from_edge: 8.0
    min_prune_dist_from_goal: 0.15
    min_prune_dist_from_start: 0.1
    num_nearest_nodes: 5
    operations:
    - AdjustSpeedLimit
    - ReroutingService
    - CollisionMonitor
    path_density: 0.05
    prune_goal: false
    qos_overrides:
      /clock:
        subscription:
          depth: 1
          durability: volatile
          history: keep_last
          reliability: best_effort
    radius_to_achieve_node: 0.0
    route_frame: map
    smooth_corners: false
    smoothing_radius: 1.0
    tracker_update_rate: 50.0
    use_sim_time: true


